name: CI and deploy

on:
  push:
    branches:
      - main
      - develop
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate production Compose configuration
        env:
          CHAT_HOST: ci.invalid
        run: docker compose -f compose.yaml config -q

      - name: Validate development Compose configuration
        run: docker compose -f compose.dev.yaml -p site-chatbot-dev config -q

      - name: Build application image
        run: docker build --tag site-chatbot:ci .

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_NAME: ghcr.io/tomvsaji/site-chatbot
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published \`${IMAGE_NAME}@${IMAGE_DIGEST}\`" >>"${GITHUB_STEP_SUMMARY}"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: site-chatbot-production
      cancel-in-progress: false
    steps:
      - name: Configure restricted deployment key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_DEPLOY_KEY}" >"${HOME}/.ssh/site-chatbot-deploy"
          chmod 600 "${HOME}/.ssh/site-chatbot-deploy"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy exact main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          case "${VPS_PORT}" in
            *[!0-9]*|'') echo "VPS_PORT must be numeric" >&2; exit 1 ;;
          esac
          ssh \
            -i "${HOME}/.ssh/site-chatbot-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "deploy ${GITHUB_SHA}"
