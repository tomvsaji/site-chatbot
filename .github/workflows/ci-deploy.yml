name: CI and deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate production Compose configuration
        env:
          CHAT_HOST: ci.invalid
        run: docker compose -f compose.yaml config -q

      - name: Validate development Compose configuration
        run: docker compose -f compose.dev.yaml -p site-chatbot-dev config -q

      - name: Build application image
        run: docker build --tag site-chatbot:ci .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: site-chatbot-production
      cancel-in-progress: false
    steps:
      - name: Configure restricted deployment key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VPS_DEPLOY_KEY}" >"${HOME}/.ssh/site-chatbot-deploy"
          chmod 600 "${HOME}/.ssh/site-chatbot-deploy"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

      - name: Deploy exact main commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          case "${VPS_PORT}" in
            *[!0-9]*|'') echo "VPS_PORT must be numeric" >&2; exit 1 ;;
          esac
          ssh \
            -i "${HOME}/.ssh/site-chatbot-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "deploy ${GITHUB_SHA}"
