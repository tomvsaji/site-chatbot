services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL: LiquidAI/LFM3-1.7B
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-site_chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_CACHE_DIR: /app/.cache/fastembed
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-3}
      REQUESTS_PER_HOUR: ${REQUESTS_PER_HOUR:-20}
      MAX_MODEL_REQUESTS: ${MAX_MODEL_REQUESTS:-1}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-800}
      MIN_SEMANTIC_SCORE: ${MIN_SEMANTIC_SCORE:-0.22}
      MIN_LEXICAL_SCORE: ${MIN_LEXICAL_SCORE:-2.0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://chat.srv1619516.hstgr.cloud,https://tomvsaji.com,https://www.tomvsaji.com}
      SITE_NAME: ${SITE_NAME:-Ask My Site}
    volumes:
      - ./data:/app/data:ro
      - embedding-cache:/app/.cache/fastembed
    ports:
      - 127.0.0.1:8082:8080
    mem_limit: 768m
    depends_on:
      - llm
      - qdrant
    labels:
      traefik.enable: "true"
      traefik.http.routers.site-chat.entrypoints: websecure
      traefik.http.routers.site-chat.rule: Host(`${CHAT_HOST}`)
      traefik.http.routers.site-chat.tls.certresolver: letsencrypt
      traefik.http.services.site-chat.loadbalancer.server.port: "8080"

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11960@sha256:8052c13edd987de8858f8150031e025ac3d66823f09cf3ec8220899c4abce220
    restart: unless-stopped
    command:
      - -m
      - /models/LFM3-1.7B-Q4_K_M.gguf
      - --alias
      - LiquidAI/LFM3-1.7B
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "4096"
      - --threads
      - "2"
      - --threads-batch
      - "2"
      - --parallel
      - "1"
      - --reasoning
      - "off"
      - --n-predict
      - "512"
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./models:/models:ro
    mem_limit: 2500m

volumes:
  embedding-cache:
  qdrant-data:
