services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      LLM_BASE_URL: http://llm:8080/v1
      LLM_MODEL: LiquidAI/LFM3-1.7B
      LLM_CONTEXT_SIZE: "8192"
      STATE_DIR: /app/state
      MAX_AGENT_SEARCHES: ${MAX_AGENT_SEARCHES:-3}
      RECENT_HISTORY_MESSAGES: ${RECENT_HISTORY_MESSAGES:-4}
      MAX_SESSION_TURNS: ${MAX_SESSION_TURNS:-40}
      MEMORY_TTL_DAYS: ${MEMORY_TTL_DAYS:-7}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-site_chunks}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_CACHE_DIR: /app/.cache/fastembed
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-3}
      REQUESTS_PER_HOUR: ${REQUESTS_PER_HOUR:-20}
      MAX_MODEL_REQUESTS: ${MAX_MODEL_REQUESTS:-1}
      MAX_QUESTION_CHARS: ${MAX_QUESTION_CHARS:-800}
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      MAX_RATE_LIMIT_CLIENTS: "${MAX_RATE_LIMIT_CLIENTS:-4096}"
      GLOBAL_REQUESTS_PER_MINUTE: "${GLOBAL_REQUESTS_PER_MINUTE:-10}"
      GLOBAL_REQUESTS_PER_HOUR: "${GLOBAL_REQUESTS_PER_HOUR:-100}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-10000}"
      MAX_HTTP_CONNECTIONS: "${MAX_HTTP_CONNECTIONS:-32}"
      REQUEST_READ_TIMEOUT: "${REQUEST_READ_TIMEOUT:-15}"
      RESPONSE_WRITE_TIMEOUT: "${RESPONSE_WRITE_TIMEOUT:-15}"
      TURNSTILE_REQUIRED: "${TURNSTILE_REQUIRED:-false}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      TURNSTILE_EXPECTED_HOSTNAMES: "${TURNSTILE_EXPECTED_HOSTNAMES:-tomvsaji.com,www.tomvsaji.com}"
      TURNSTILE_EXPECTED_ACTION: "${TURNSTILE_EXPECTED_ACTION:-site_chat}"
      TURNSTILE_TIMEOUT: "${TURNSTILE_TIMEOUT:-5}"
      MIN_SEMANTIC_SCORE: ${MIN_SEMANTIC_SCORE:-0.22}
      MIN_LEXICAL_SCORE: ${MIN_LEXICAL_SCORE:-2.0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://chat.srv1619516.hstgr.cloud,https://tomvsaji.com,https://www.tomvsaji.com}
      SITE_NAME: ${SITE_NAME:-Ask My Site}
    volumes:
      - ./data:/app/data:ro
      - conversation-data:/app/state
      - embedding-cache:/app/.cache/fastembed
    ports:
      - 127.0.0.1:8082:8080
    mem_limit: 768m
    depends_on:
      - llm
      - qdrant
    labels:
      traefik.enable: "true"
      traefik.http.routers.site-chat.entrypoints: websecure
      traefik.http.routers.site-chat.rule: Host(`${CHAT_HOST}`)
      traefik.http.routers.site-chat.tls.certresolver: letsencrypt
      traefik.http.services.site-chat.loadbalancer.server.port: "8080"

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11960@sha256:8052c13edd987de8858f8150031e025ac3d66823f09cf3ec8220899c4abce220
    restart: unless-stopped
    command:
      - -m
      - /models/LFM3-1.7B-Q4_K_M.gguf
      - --alias
      - LiquidAI/LFM3-1.7B
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "8192"
      - --threads
      - "2"
      - --threads-batch
      - "2"
      - --parallel
      - "1"
      - --reasoning
      - "off"
      - --n-predict
      - "640"
      - --jinja
      - --no-reasoning-preserve
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./models:/models:ro
    mem_limit: 2500m

volumes:
  conversation-data:
  embedding-cache:
  qdrant-data:
